<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Elysium X 20 - emotion-state engine for AI agents">
<defs>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2a2a2a"/></pattern>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0a0a" stop-opacity="0"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient>
<clipPath id="tc"><rect x="80" y="196" height="40" width="0"><animate attributeName="width" values="0;562;562;0" keyTimes="0;0.5;0.9;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/></rect></clipPath>
</defs>
<rect width="1200" height="320" fill="#0a0a0a"/>
<rect width="1200" height="320" fill="url(#g)"/>
<rect x="0.5" y="0.5" width="1199" height="319" fill="none" stroke="#2e2e2e"/>
<rect x="0" y="0" width="1200" height="2" fill="#f2f2f2" opacity="0.9"><animate attributeName="y" values="0;318;0" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.0;0.35;0.0" dur="9s" repeatCount="indefinite"/></rect>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" fill="#8a8a8a" font-size="13" letter-spacing="2"><text x="80" y="70">PROJECT NHE  /  OPEN SOURCE  /  MIT</text><text x="1120" y="70" text-anchor="end">v0.1.0</text></g>
<text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" x="78" y="150" font-size="68" font-weight="700" fill="#f2f2f2" letter-spacing="6">ELYSIUM X 20</text>
<text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" x="80" y="178" font-size="16" fill="#8a8a8a" letter-spacing="1">an emotion-state engine for AI agents and companion models</text>
<g clip-path="url(#tc)"><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" x="80" y="224" font-size="26" fill="#f2f2f2" textLength="562" lengthAdjust="spacing">appraise &gt; update &gt; decay &gt; modulate</text></g>
<rect x="80" y="204" width="14" height="26" fill="#f2f2f2"><animate attributeName="x" values="80;642;642;80" keyTimes="0;0.5;0.9;1" dur="8s" repeatCount="indefinite" calcMode="discrete"/><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" calcMode="discrete"/></rect>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#6b6b6b" letter-spacing="2"><text x="80" y="285">STATE</text><text x="170" y="285">DECAY</text><text x="260" y="285">PROMPT</text><text x="365" y="285">STYLE</text><text x="455" y="285">MEMORY</text><text x="1120" y="285" text-anchor="end">PURE PYTHON / ZERO DEPENDENCIES</text></g>
<line x1="80" y1="262" x2="1120" y2="262" stroke="#2e2e2e"/>
</svg>
